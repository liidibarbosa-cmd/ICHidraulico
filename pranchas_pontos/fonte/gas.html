<text x="1263.00" y="177.00" font-family="Manrope" font-weight="500" font-size="8.60" fill="#4f5240" text-anchor="start" >Altura do piso acabado ao eixo do ponto. Cores: amarelo = gás (NBR 6493).</text>
<rect x="1247.20" y="320.40" width="408.00" height="592.30" rx="16.00" fill="#f7f2e8" stroke="none" stroke-width="0.00" />
<text x="1263.20" y="344.90" font-family="Aloevera" font-weight="700" font-size="17.00" fill="#22251a" text-anchor="start" >Observações técnicas</text>
<text x="1637.40" y="345.90" font-family="Manrope" font-weight="700" font-size="10.00" fill="#22251a" text-anchor="end" letter-spacing="2.60" >QUADRO 3</text>
<text x="1263.20" y="367.40" font-family="Manrope" font-weight="700" font-size="12.00" fill="#903f2a" text-anchor="start" >1. Escopo</text>
<text x="1263.20" y="383.40" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >Localização do abrigo de GLP e do ponto de consumo. Não é projeto de</text>
<text x="1263.20" y="398.63" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >gás: rede interna, diâmetros, trajeto, regulador, registros, teste de</text>
<text x="1263.20" y="413.86" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >estanqueidade e ventilação seguem o projeto de gás do responsável</text>
<text x="1263.20" y="429.10" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >técnico.</text>
<text x="1263.20" y="452.33" font-family="Manrope" font-weight="700" font-size="12.00" fill="#903f2a" text-anchor="start" >2. Abrigo</text>
<text x="1263.20" y="468.33" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >Dois botijões P13 sob as condensadoras C1 e C2, na projeção delas.</text>
<text x="1263.20" y="483.56" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >Posição das condensadoras conforme a prancha de Tomadas R05; o</text>
<text x="1263.20" y="498.79" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >caderno de ar condicionado ainda indica localização a confirmar.</text>
<text x="1263.20" y="522.02" font-family="Manrope" font-weight="700" font-size="12.00" fill="#903f2a" text-anchor="start" >3. Fogão</text>
<text x="1263.20" y="538.02" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >Ponto de gás a 0,60 do piso acabado, no eixo de 1,36 da parede da</text>
<text x="1263.20" y="553.26" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >janela. Conexão do fogão conforme o fabricante.</text>
<text x="1263.20" y="576.49" font-family="Manrope" font-weight="700" font-size="12.00" fill="#903f2a" text-anchor="start" >4. Alturas e cotas</text>
<text x="1263.20" y="592.49" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >Alturas do piso acabado ao eixo. Cotas em metros, a partir da face da</text>
<text x="1263.20" y="607.72" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >parede indicada. Conferir as medidas no local.</text>
<text x="1263.20" y="630.95" font-family="Manrope" font-weight="700" font-size="12.00" fill="#903f2a" text-anchor="start" >5. Normas</text>
<text x="1263.20" y="646.95" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >NBR 15526 (redes de distribuição interna de gases combustíveis), NBR</text>
<text x="1263.20" y="662.18" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >13523 (central de GLP) e IT 28 do Corpo de Bombeiros do Estado de São</text>
