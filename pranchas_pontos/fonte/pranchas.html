<text x="1263.00" y="210.20" font-family="Manrope" font-weight="500" font-size="8.60" fill="#4f5240" text-anchor="start" >Letra no círculo = serviço. Altura do piso acabado ao eixo do ponto.</text>
<rect x="1247.20" y="320.40" width="408.00" height="592.30" rx="16.00" fill="#f7f2e8" stroke="none" stroke-width="0.00" />
<text x="1263.20" y="344.90" font-family="Aloevera" font-weight="700" font-size="17.00" fill="#22251a" text-anchor="start" >Observações técnicas</text>
<text x="1637.40" y="345.90" font-family="Manrope" font-weight="700" font-size="10.00" fill="#22251a" text-anchor="end" letter-spacing="2.60" >QUADRO 3</text>
<text x="1263.20" y="367.40" font-family="Manrope" font-weight="700" font-size="12.00" fill="#903f2a" text-anchor="start" >1. Escopo</text>
<text x="1263.20" y="383.40" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >Prancha de localização de pontos. Não é projeto de dimensionamento:</text>
<text x="1263.20" y="398.63" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >diâmetros, trajetos, declividades, ventilação, caixas e ramais seguem o</text>
<text x="1263.20" y="413.86" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >projeto hidrossanitário do responsável técnico.</text>
<text x="1263.20" y="437.10" font-family="Manrope" font-weight="700" font-size="12.00" fill="#903f2a" text-anchor="start" >2. Posições</text>
<text x="1263.20" y="453.10" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >Cotas em metros, a partir da face da parede indicada em cada ponto. Os</text>
<text x="1263.20" y="468.33" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >pontos dos ambientes estão cotados nas ampliações (pranchas 02 e</text>
<text x="1263.20" y="483.56" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >03); os externos, nesta prancha.</text>
<text x="1263.20" y="506.79" font-family="Manrope" font-weight="700" font-size="12.00" fill="#903f2a" text-anchor="start" >3. Alturas</text>
<text x="1263.20" y="522.79" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >Do piso acabado ao eixo do ponto. A fonte de cada valor está no Quadro</text>
<text x="1263.20" y="538.02" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >1B.</text>
<text x="1263.20" y="561.26" font-family="Manrope" font-weight="700" font-size="12.00" fill="#903f2a" text-anchor="start" >4. Chuveiros</text>
<text x="1263.20" y="577.26" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >Saída de chuveiro com registro misturador (água quente e fria). Sem</text>
<text x="1263.20" y="592.49" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >chuveiro elétrico (Tomadas R05, item 12).</text>
<text x="1263.20" y="615.72" font-family="Manrope" font-weight="700" font-size="12.00" fill="#903f2a" text-anchor="start" >5. Registro geral</text>
<text x="1263.20" y="631.72" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >Dentro do armário da bancada de cada banheiro, a 0,55 m. Eixo sem</text>
<text x="1263.20" y="646.95" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >cota: definir com a marcenaria.</text>
<text x="1263.20" y="670.18" font-family="Manrope" font-weight="700" font-size="12.00" fill="#903f2a" text-anchor="start" >6. Compatibilização</text>
<text x="1263.20" y="686.18" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >Pontos elétricos conforme a prancha de Tomadas R05. Manter no</text>
<text x="1263.20" y="701.42" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >mínimo 0,30 m entre tomadas e pontos de água e esgoto. Conferir as</text>
<text x="1263.20" y="716.65" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >medidas no local antes de fechar as paredes.</text>
<text x="1263.20" y="739.88" font-family="Manrope" font-weight="700" font-size="12.00" fill="#903f2a" text-anchor="start" >7. Normas</text>
<text x="1263.20" y="755.88" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >NBR 5626 (água fria e água quente), NBR 8160 (esgoto sanitário) e NBR</text>
<text x="1263.20" y="771.11" font-family="Manrope" font-weight="400" font-size="11.20" fill="#22251a" text-anchor="start" >10339 (piscinas).</text>

<text x="1263.20" y="367.40" font-family="Manrope" font-weight="700" font-size="12.00" fill="#903f2a" text-anchor="start" >1. Chuveiro</text>
<text x="1263.20" y="383.40" font-family="Manrope" font-weight="400" font-size="10.60" fill="#22251a" text-anchor="start" >Saída de chuveiro a 2,10 e registro misturador (AF/AQ) a 1,10, no mesmo eixo.</text>

<text x="1263.20" y="436.23" font-family="Manrope" font-weight="400" font-size="10.60" fill="#22251a" text-anchor="start" >Alimentação a 0,30, esgoto no piso e válvula de descarga a 1,10 no eixo da</text>
<text x="1263.20" y="450.65" font-family="Manrope" font-weight="400" font-size="10.60" fill="#22251a" text-anchor="start" >bacia.</text>
<text x="1263.20" y="473.06" font-family="Manrope" font-weight="700" font-size="12.00" fill="#903f2a" text-anchor="start" >3. Registro geral</text>
<text x="1263.20" y="489.06" font-family="Manrope" font-weight="400" font-size="10.60" fill="#22251a" text-anchor="start" >A 0,55, dentro do armário da bancada. Eixo sem cota (marcador tracejado):</text>
<text x="1263.20" y="503.48" font-family="Manrope" font-weight="400" font-size="10.60" fill="#22251a" text-anchor="start" >definir com a marcenaria.</text>
<text x="1263.20" y="525.90" font-family="Manrope" font-weight="700" font-size="12.00" fill="#903f2a" text-anchor="start" >4. Referências</text>
<text x="1263.20" y="541.90" font-family="Manrope" font-weight="400" font-size="10.60" fill="#22251a" text-anchor="start" >WC 01, WC 02 e WC Externo: chuveiro pela parede esquerda, demais peças</text>
<text x="1263.20" y="556.31" font-family="Manrope" font-weight="400" font-size="10.60" fill="#22251a" text-anchor="start" >pela direita. WC Suíte Master: peças pela parede superior, chuveiro pela</text>
<text x="1263.20" y="570.73" font-family="Manrope" font-weight="400" font-size="10.60" fill="#22251a" text-anchor="start" >inferior. Vistas esquemáticas: eixos e alturas, sem louças.</text>
